<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Harinaama Mandiram - Balanagar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fdf8f2; font-family: Georgia, sans-serif; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 2.5rem 1.5rem; text-align: center; }
    .logo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 3px solid #c8a76b; display: block; margin: 0 auto 1rem;
            box-shadow: 0 0 0 6px rgba(200,167,107,0.15); }
    h1 { font-size: 22px; font-weight: 700; color: #2c1a00; margin-bottom: 4px; }
    .sub { font-size: 14px; color: #888; margin-bottom: 1.5rem; }
    .divider { width: 60px; height: 2px;
               background: linear-gradient(90deg, transparent, #c8a76b, transparent);
               margin: 0 auto 1.5rem; }
    .btn { display: block; width: 100%; padding: 14px 20px; margin-bottom: 12px;
           border-radius: 10px; font-size: 15px; font-weight: 600;
           text-decoration: none; color: #fff;
           transition: transform 0.2s, filter 0.2s; }
    .btn:hover { transform: translateY(-2px); filter: brightness(0.88); }
    .wa  { background: #25D366; }
    .dir { background: #4285F4; }
    .yt  { background: #FF0000; }
    .ig  { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
    hr   { border: none; border-top: 1px solid #eee; margin: 8px 0 16px; }
    .footer { color: #aaa; font-size: 12px; margin-top: 1.5rem; }

    .donate-box { background: #fff8ee; border: 1.5px solid #c8a76b;
                  border-radius: 12px; padding: 20px; margin-bottom: 12px; }
    .donate-title { font-size: 16px; font-weight: 700; color: #2c1a00; margin-bottom: 14px; }
    .donate-box img { width: 200px; height: 200px; border-radius: 8px;
                      display: block; margin: 0 auto; }
    .upi-id-box { display: flex; align-items: center; justify-content: center;
                  gap: 8px; background: #fff; border: 1px solid #e0c99a;
                  border-radius: 8px; padding: 10px 14px; margin-top: 14px; }
    .upi-id-text { font-size: 14px; font-weight: 600; color: #5f259f;
                   letter-spacing: 0.3px; }
    .copy-btn { background: #c8a76b; color: #fff; border: none; border-radius: 6px;
                padding: 6px 12px; font-size: 13px; font-weight: 600;
                cursor: pointer; transition: filter 0.2s; }
    .copy-btn:hover { filter: brightness(0.88); }
    .copy-msg { font-size: 12px; color: #25D366; margin-top: 8px;
                height: 16px; font-weight: 600; }
    .donate-hint { font-size: 12px; color: #aaa; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">

    <img class="logo"
      src="https://cdn3.me-qr.com/constructor/user/1612910/1778340417.png"
      alt="Harinaama Mandiram Logo" />
    <h1>Harinaama Mandiram</h1>
    <p class="sub">Balanagar, Hyderabad</p>
    <div class="divider"></div>

    <a class="btn wa" href="https://chat.whatsapp.com/LXq5RLI1Y51BApi2Q5Ggvd" target="_blank" rel="noopener">
      📱 Join WhatsApp Group
    </a>

    <a class="btn dir" href="https://maps.app.goo.gl/LBKgXwGz3DFgzwQ38" target="_blank" rel="noopener">
      📍 Get Directions to Center
    </a>

    <div class="donate-box">
      <div class="donate-title">🙏 Donate (UPI)</div>
      <img src="donate-qr.jpg" alt="UPI QR Code - Harinaama Mandiram" />
      <div class="upi-id-box">
        <span class="upi-id-text" id="upiId">harinaamamandiram@ybl</span>
        <button class="copy-btn" onclick="copyUPI()">Copy</button>
      </div>
      <div class="copy-msg" id="copyMsg"></div>
      <div class="donate-hint">📷 Scan QR &nbsp;|&nbsp; or Copy UPI ID and pay in any app</div>
    </div>

    <hr />

    <a class="btn yt" href="https://www.youtube.com/@Kurmagrama" target="_blank" rel="noopener">
      ▶ @Harinama_Mandiram on YouTube
    </a>

    <a class="btn ig" href="https://www.instagram.com/kurmagrama" target="_blank" rel="noopener">
      📷 @Harinaama_Mandiram on Instagram
    </a>

    <p class="footer">🙏 Hare Krishna · Hare Rama</p>
  </div>

  <script>
    function copyUPI() {
      var upi = document.getElementById('upiId').innerText;
      navigator.clipboard.writeText(upi).then(function() {
        var msg = document.getElementById('copyMsg');
        msg.innerText = '✅ UPI ID copied!';
        setTimeout(function() { msg.innerText = ''; }, 3000);
      });
    }
  </script>
</body>
</html>
